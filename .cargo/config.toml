# macOS needs deferred symbol resolution to link a Python extension module
# (`aria-engine-py`) without an explicit libpython. This is the linker
# configuration documented by PyO3 for `extension-module` builds.

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]
