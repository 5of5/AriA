# aria-json-telemetry hosted node — drop-in sidecar for a worker stack.
#
#   docker compose -f compose.telemetry.yaml up --build
#   docker compose -f compose.telemetry.yaml up --build --scale telemetry=4
#
# Stateless: scaling is horizontal by construction (sequential and parallel
# callbacks are byte-identical — dump proves it every run). No volumes.
services:
  telemetry:
    build:
      context: .
      dockerfile: Dockerfile
      target: work
    image: aria-work:0.2.2
    command: ["--serve", "0.0.0.0:8080", "--steps", "0"]
    ports:
      - "127.0.0.1:58180:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # scratch image: no shell/curl. The harness lane doubles as the probe —
      # `--commands` exits 0 iff the catalog loads. Compose runs it via exec.
      test: ["CMD", "/work", "--commands"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
