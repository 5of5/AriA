[package]
name = "aria-engine-py"
description = "Python bindings for the Aria transformer runtime — Spec-faithful Φ-cycles with invariant checking"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
# The repo README (python/README.md died with python/training/).
readme = "../../README.md"
rust-version.workspace = true
keywords = ["aria", "python", "transformer", "runtime", "safety"]
categories = ["science", "api-bindings"]

[lib]
name = "aria"
crate-type = ["cdylib", "rlib"]

[dependencies]
aria-engine-core = { version = "0.2.0", path = "../../crates/aria-core" }
aria-engine-backends = { version = "0.2.0", path = "../../crates/aria-backends" }
pyo3 = { workspace = true, features = ["extension-module", "abi3-py38"] }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
