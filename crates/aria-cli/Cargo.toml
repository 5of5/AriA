[package]
name = "aria-engine"
description = "CLI for the Aria transformer runtime — run Spec-faithful Φ-cycles with invariant checking, trace export, and configurable schedules"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
rust-version.workspace = true
keywords = ["aria", "cli", "transformer", "runtime", "safety"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "aria"
path = "src/main.rs"

[dependencies]
aria-engine-core = { workspace = true }
# The native binary enables OCID signature verification; the WASM surface
# deliberately does not, so wasm32 stays free of curve code.
aria-engine-backends = { workspace = true, features = ["ocid-ed25519"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
log.workspace = true
env_logger.workspace = true
num-complex.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
