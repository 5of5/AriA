[package]
name = "aria-engine-backends"
description = "Simulated operator backends for the Aria transformer — pluggable optical unitary, JEPA predictor, graph editor, and diffuser implementations"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
rust-version.workspace = true
keywords = ["aria", "simulation", "unitary", "jepa", "optical"]
categories = ["science", "simulation", "algorithms"]

[dependencies]
aria-engine-core = { version = "0.2.0", path = "../aria-core" }
num-complex.workspace = true
num-traits.workspace = true
rand.workspace = true
rand_distr.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# ℙ1/§5.2: O(N log N) FFT phase-mask optical kernel (plan WS2). FftPlannerScalar
# only — the generic FftPlanner auto-dispatches SIMD and would break parity.
# The workspace pin disables default features (avx/sse/neon stay OFF) so the
# scalar butterfly path is the only one that exists on any target.
rustfft = { workspace = true }
# Pure-Rust libm for the optical mask trig (plan WS2 parity fix): the host
# libm differs between execution environments (the MAX/Mojo-venv Python's
# sin/cos disagrees with the CLI's by ulps at specific arguments — measured).
# Compiling the same deterministic implementation into the shared rlib makes
# every surface bit-identical; WASM gets the same code for free.
libm.workspace = true
# Plan WS4: zero-copy weight files for the decoupled readout (𝔸5). Pure Rust,
# wasm32-clean, no OS entropy. tokenizers (HF) stays unused — its default
# onig backend is C and would fail the same wasm32 wall WS3 hit; BPE is
# implemented in-repo (tokenizer.rs) so every surface compiles.
safetensors = { workspace = true }
# usearch is the spec-normative §5.3 retrieval engine, kept native-only (C++
# FFI does not compile to wasm32-unknown-unknown and cross-platform
# bit-determinism is unproven — Q-2026-08-12-5). OFF by default; the WS3
# VectorIndex seam decides whether a run enables it.
usearch = { workspace = true, optional = true }

[features]
usearch = ["dep:usearch"]

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
